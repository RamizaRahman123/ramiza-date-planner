# Date planner: one container.
# EC2 host port 80 -> container port 3000 (the ALB target group sends traffic to port 80).

services:
  dates:
    build: .
    container_name: ramiza-dates
    restart: unless-stopped
    ports:
      - "80:3000"
    environment:
      SITE_PASSCODE: ${SITE_PASSCODE:?Set SITE_PASSCODE in .env}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      HER_NAME: ${HER_NAME:-Me}
      HIS_NAME: ${HIS_NAME:-My love}
    volumes:
      - dates_data:/data   # dates, votes, photos and the song survive rebuilds

volumes:
  dates_data:
